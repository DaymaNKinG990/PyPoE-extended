name: Tests

on:
  push:
    branches: [dev, main, update_feature]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --extra dev --extra cli --extra ui

    - name: Run linters
      run: |
        uv run ruff check PyPoE/
      continue-on-error: true

    - name: Run type checker
      run: |
        uv run mypy PyPoE/poe/file/ --ignore-missing-imports --no-error-summary
      continue-on-error: true

    - name: Run tests
      run: |
        uv run pytest tests/ -v --tb=short --maxfail=10
      continue-on-error: false

    - name: Test CLI
      run: |
        uv run pypoe_exporter --help

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run pre-commit
      run: |
        uv pip install pre-commit
        uv run pre-commit run --all-files --show-diff-on-failure
      continue-on-error: true
